i+1}</span><h3>${s}</h3></div><p>${a}</p><div class=\"fx\">→ ${t}</div>${i<3?'<span class=\"ar\" aria-hidden=\"true\">›</span>':\"\"}</div>`).join(\"\");const t=[[\"stu\",\"மாணவர்களுக்கு\"],[\"tea\",\"ஆசிரியர்களுக்கு\"],[\"lang\",\"தமிழ் மொழிக்கு\"],[\"th\",\"கோட்பாட்டு அடிப்படை\"],[\"ba\",\"முன் – பின் எடுத்துக்காட்டு\"]];s(\"tabs\").innerHTML=t.map(([s,a],t)=>`<button role=\"tab\" aria-selected=\"${0===t}\" data-tab=\"${s}\">${a}</button>`).join(\"\");const i=([s,t,i])=>`<div class=\"cd\"><h3>${s}</h3><p>${t}</p>${i?`<div class=\"eg\">${a(i)}</div>`:\"\"}</div>`;s(\"p-stu\").innerHTML=`<div class=\"cards\">${[[\"உடனடிப் பின்னூட்டம்\",\"எழுதிய சில நொடிகளில் பிழைகள் சுட்டப்படுகின்றன. ஆசிரியர் திருத்தித் தரும் வரை காத்திருக்க வேண்டியதில்லை; தவறான வடிவம் மனத்தில் பதிவதற்கு முன்பே திருத்திக்கொள்ளலாம்.\",null],[\"விதியோடு கூடிய விளக்கம்\",'\"வலிமிகும் இடம்\", \"திணை வழு\" போன்ற இலக்கணச் சொற்களுடன் விதி விளக்கப்படுவதால், மாணவர் சரியான விடையை மட்டுமன்றி அதற்கான காரணத்தையும் அறிகிறார்.','பாடத்தை படித்தான் → பாடத்தைப் படித்தான் (இரண்டாம் வேற்றுமை \"ஐ\"க்குப் பின் வலி மிகும்)'],[\"ஒலி ஒத்த எழுத்துகளில் தெளிவு\",\"ல – ள – ழ, ண – ன – ந, ர – ற எழுத்துகளை மாற்றி எழுதினால் பொருளே மாறும் என்பதை எடுத்துக்காட்டுகள் காட்டுவதால், எழுத்துணர்வும் சொற்பொருள் உணர்வும் வளர்கின்றன.\",\"வலி (நோவு) · வளி (காற்று) · வழி (பாதை)\"],[\"தன் பலவீனத்தை அறிதல்\",'பிழைகள் ஐந்து பகுப்புகளாக எண்ணிக் காட்டப்படுவதால், \"நான் ஒற்றுப் பிழைகளையே அதிகம் செய்கிறேன்\" என்று மாணவர் தம் கற்றல் தேவையைத் தாமே அறிகிறார்.',null],[\"தூய தமிழ்ச் சொல் பயன்பாடு\",\"பேச்சு வழக்கு, பிறமொழிச் சொற்களுக்கு இணையான தமிழ்ச் சொற்கள் பரிந்துரைக்கப்படுவதால் எழுத்துத் தமிழின் தரம் உயர்கிறது.\",\"டீச்சர் → ஆசிரியர் · பஸ் → பேருந்து · நேத்து → நேற்று\"],[\"தன்னிச்சைக் கற்றல்\",\"வீட்டிலும் வகுப்பிலும் எந்தச் சாதனத்திலும் பயன்படுத்தலாம். பயிற்சிகளுக்கு உடனடி மதிப்பெண் கிடைப்பதால், மாணவர் தம் வேகத்தில் கற்று, தம் முன்னேற்றத்தைத் தாமே கண்காணிக்கலாம்.\",null]].map(i).join(\"\")}</div>`,s(\"p-tea\").innerHTML=`<div class=\"cards\">${[[\"திருத்தும் நேரம் குறைவு\",\"எழுத்து, ஒற்று, இயைபு போன்ற இயந்திரத்தனமான பிழைகளை முன்மாதிரி முதலில் சுட்டுவதால், ஆசிரியர் கட்டுரையின் கருத்து, அமைப்பு, நடை ஆகியவற்றில் கூடுதல் கவனம் செலுத்தலாம்.\"],[\"வகுப்பின் பொதுப் பிழைகளை அறிதல்\",\"மாணவர் உரைகளில் அடிக்கடி வரும் பிழை வகைகளைக் கண்டு, அவற்றுக்கென்று குறைநீக்கல் பாடம் திட்டமிடலாம். இது பிழை ஆய்வு (Error Analysis) அணுகுமுறை.\"],[\"வேறுபட்ட கற்பித்தல்\",\"பயிற்சி மதிப்பெண்களும் பகுப்பு வாரியான முடிவுகளும் மாணவர்களை வலுவூட்டல், குறைநீக்கல் குழுக்களாகப் பிரித்துக் கற்பிக்க உதவுகின்றன.\"],[\"கலைத்திட்டத் தொடர்பு\",\"வலிமிகும் / மிகா இடங்கள், திணை – பால் – எண் – இட இயைபு, மரபுத் தொடர்கள் போன்ற தமிழ்மொழிக் கலைத்திட்ட இலக்கணக் கூறுகளுடன் நேரடித் தொடர்புடையது.\"],[\"சான்றுடன் கூடிய மதிப்பீடு\",\"பயிற்சியின் முடிவில் மாணவரின் பெயர், வகுப்பு, மதிப்பெண், தரம், பகுப்பு வாரியான அடைவு ஆகியவை ஒரே திரையில் காட்டப்படுவதால், வகுப்பறை மதிப்பீட்டுக்குச் சான்றாகப் பயன்படுத்தலாம்.\"]].map(i).join(\"\")}</div>`,s(\"p-lang\").innerHTML=`<div class=\"cards\">${[[\"எழுத்துத் தமிழின் தரம் காத்தல்\",\"சமூக ஊடகங்கள், குறுஞ்செய்திகள் வழியே பரவும் பேச்சு வழக்கையும் கலப்பு நடையையும் எழுத்தில் தவிர்க்க வழிகாட்டுகிறது.\"],[\"இலக்கண மரபைப் பேணுதல்\",\"ஒலி மரபு (யானை பிளிறும்), இளமைப் பெயர் மரபு (பசுவின் கன்று), வினை மரபு (நீர் குடித்தான்) போன்ற தொல்காப்பிய மரபுகளை அன்றாட எழுத்தில் நினைவூட்டுகிறது.\"],[\"தமிழ்க் கணிமை வளர்ச்சி\",\"விதி அடிப்படையிலான இம்முன்மாதிரி, தமிழுக்கான மொழித் தொழில்நுட்பக் கருவிகளை உருவாக்கும் முயற்சியின் தொடக்கம். பெரிய தரவுத்தொகுப்பு, செயற்கை நுண்ணறிவு மாதிரிகளுடன் இணைத்து எதிர்காலத்தில் விரிவாக்கலாம்.\"]].map(i).join(\"\")}</div>`,s(\"p-th\").innerHTML=`<div class=\"tbl\"><table class=\"th\"><tr><th>கோட்பாடு</th><th>முதன்மைக் கருத்து</th><th>முன்மாதிரியில் செயல்படும் விதம்</th></tr>${[[\"நடத்தைக் கோட்பாடு\",\"B. F. Skinner\",\"உடனடி வலுவூட்டல் விரும்பிய நடத்தையை நிலைப்படுத்தும்.\",\"உடனடிப் பின்னூட்டம்; பயிற்சிக்கு உடனடி மதிப்பெண், தரம்.\"],[\"பிழை ஆய்வு\",\"S. P. Corder (1967)\",\"மாணவர் செய்யும் பிழைகள் அவரது கற்றல் நிலையைக் க ை திருத்தி</span><span>பிழைப் பதிவேடு</span><span>பயிற்சி</span><span>வழிகாட்டி</span></div><div style=\"height:70px\"></div></div></div>`},{t:\"தமிழில் உரையை உள்ளிடுதல்\",steps:['\"உங்கள் உரை\" என்ற கோடிட்ட தாளில் சொடுக்கவும்.','ஒரு வாக்கியம், ஒரு பத்தி அல்லது முழுக் கட்டுரையைத் தட்டச்சு செய்யவும், அல்லது வேறு இடத்திலிருந்து நகலெடுத்து ஒட்டவும் (<span class=\"kbd\">Ctrl</span> + <span class=\"kbd\">V</span>).','தமிழ் தட்டச்சுக்கு: Windows-இல் Settings → Time &amp; Language → Language என்பதில் \"தமிழ்\" (Tamil Phonetic / Tamil 99) சேர்க்கவும்; கைப்பேசியில் Gboard அல்லது செல்லினம் விசைப்பலகையைப் பயன்படுத்தவும்.',\"உரையின் சொல், வாக்கிய எண்ணிக்கை கீழே தானாகக் காட்டப்படும்.\"],tip:\"ஒருங்குறி (Unicode) தமிழ் எழுத்துருவில் உள்ள உரை மட்டுமே சரியாகப் பகுப்பாய்வு செய்யப்படும். பழைய TAM / TAB எழுத்துருக்களில் உள்ள உரையை முதலில் ஒருங்குறிக்கு மாற்றவும்.\",ill:()=>`<div class=\"ill\">${a(\"பிழை திருத்தி · உங்கள் உரை\")}<div class=\"in\"><div class=\"mini-ta\">நேற்று நானும் என் தம்பியும் பள்ளிக்கு சென்றார்கள்<span class=\"caret\"></span></div><div class=\"mini-btns\"><span style=\"margin-left:auto;color:var(--ink-3);font-size:12px\">7 சொற்கள் · 1 வாக்கியம்</span></div></div></div>`},{t:\"மாதிரி உரைகளை முயலுதல்\",steps:[\"முதன்முறையாகப் பயன்படுத்துபவர்கள் உரைப்பெட்டியின் மேலே உள்ள மாதிரிப் பொத்தான்களைச் சொடுக்கலாம்.\",\"<b>மாதிரி: கட்டுரை</b> – பல்வகைப் பிழைகள் கொண்ட சிறு கட்டுரை.\",\"<b>பேச்சுத்தமிழ்</b> – பேச்சு வழக்கு, பிறமொழிச் சொற்கள் கலந்த உரை.\",\"<b>மரபு &amp; இயைபு</b> – மரபுப் பிழைகளும் எழுவாய் – பயனிலை இயைபுப் பிழைகளும்.\"],tip:'மாதிரியைச் சொடுக்கியதும் உரை தானாகச் சரிபார்க்கப்படும். உங்கள் சொந்த உரையைச் சோதிக்க \"அழி\" பொத்தானை அழுத்தி உரைப்பெட்டியைக் காலியாக்கவும்.',ill:()=>`<div class=\"ill\">${a(\"பிழை திருத்தி\")}<div class=\"in\"><div class=\"mini-btns\" style=\"margin:0 0 10px\"><span class=\"mb sm hl\">மாதிரி: கட்டுரை</span><span class=\"mb sm\">பேச்சுத்தமிழ்</span><span class=\"mb sm\">மரபு &amp; இயைபு</span></div><div class=\"mini-ta\" style=\"min-height:70px\">நேற்று நானும் என் தம்பியும் பள்ளிக்கு சென்றார்கள். வகுப்பில் டீச்சர்…</div></div></div>`},{t:'\"சரிபார்\" பொத்தானை அழுத்துதல்',steps:[\"உரையை உள்ளிட்ட பின் சிவப்பு நிற <b>சரிபார்</b> பொத்தானை அழுத்தவும்.\",'விசைப்பலகைக் குறுக்குவழி: <span class=\"kbd\">Ctrl</span> + <span class=\"kbd\">Enter</span> (Mac-இல் <span class=\"kbd\">⌘</span> + <span class=\"kbd\">Enter</span>).',\"சில நொடிகளுக்குள் உரையில் உள்ள பிழைகள் சிவப்பு மையில் குறிக்கப்படும்.\",'உரையை மாற்றிய ஒவ்வொரு முறையும் மீண்டும் \"சரிபார்\" அழுத்தவும்.'],tip:'\"அழி\" பொத்தான் உரைப்பெட்டியையும் அறிக்கையையும் முழுமையாகக் காலியாக்கும்.',ill:()=>`<div class=\"ill\">${a(\"பிழை திருத்தி\")}<div class=\"in\"><div class=\"mini-ta\" style=\"min-height:60px\">நேற்று நானும் என் தம்பியும் பள்ளிக்கு சென்றார்கள்.</div><div class=\"mini-btns\"><span class=\"mb pen\">சரிபார்</span><span class=\"mb\">அழி</span><span style=\"margin-left:auto\"><span class=\"kbd\">Ctrl</span> + <span class=\"kbd\">Enter</span></span></div></div></div>`},{t:\"திருத்தக் குறிப்புகளைப் புரிந்துகொள்ளுதல்\",steps:['\"திருத்தக் குறிப்புகள்\" பகுதியில், ஆசிரியர் சிவப்பு மையால் திருத்துவது போலவே பிழையான சொல் <span class=\"wrong\">அடித்துக்</span> காட்டப்பட்டு, அதன் மேலே சரியான வடிவம் <span class=\"pen\">கையெழுத்தில்</span> எழுதப்படும்.',\"ஒவ்வொரு பிழைக்கும் ஒரு சிறிய எண் தரப்படும்; அது வலப்பக்க அறிக்கையில் உள்ள விளக்க அட்டையின் எண்ணோடு பொருந்தும்.\",\"மஞ்சள் அலைக்கோடு = <b>பரிந்துரை</b> (கட்டாயப் பிழையன்று; நடையைச் செம்மைப்படுத்தும் ஆலோசனை).\",'<b style=\"color:var(--pen)\">⁁</b> குறி = விடுபட்ட நிறுத்தற்குறி. குறிக்கப்பட்ட சொல்லைச் சொடுக்கினால் அதன் விளக்க அட்டை முன்னிலைப்படுத்தப்படும்.'],ill:()=>`<div class=\"ill\">${a(\"திருத்தக் குறிப்புகள்\")}<div class=\"in\"><div class=\"ann\">நானும் என் தம்பியும் <span class=\"e\"><span class=\"fx\">பள்ளிக்குச்</span><s>பள்ளிக்கு</s><sup>1</sup></span> <span class=\"e\"><span class=\"fx\">சென்றோம்</span><s>சென்றார்கள்</s><sup>2</sup></span>. நாங்கள் <span class=\"e w\"><span class=\"fx\">எல்லோரும்</span><s>எல்லாரும்</s><sup>3</sup></span> மகிழ்ந்தோம்<span class=\"e\"><span class=\"fx\">.</span><sup>4</sup></span><b style=\"color:var(--pen)\">⁁</b></div>\\n        <div class=\"legend\"><div><span class=\"wrong\">சொல்</span> சிவப்பு அடிப்பு = பிழை</div><div><span class=\"pen\" style=\"font-size:15px\">திருத்தம்</span> சிவப்புக் கையெழுத்து = சரியான வடிவம்</div><div><span style=\"text-decoration:underline wavy var(--turmeric)\">சொல்</span> மஞ்சள் அலைக்கோடு = பரிந்துரை</div></div></div></div>`},{t:\"பிழை அறிக்கையைப் படித்தல்\",steps:[\"வலப்பக்க <b>பிழை அறிக்கை</b> கண்டறியப்பட்ட மொத்தப் பிழைகளின் எண்ணிக்கையைக் காட்டும்.\",\"ஐந்து <b>பகுப்புகள்</b> (ள·ல·ழ, ண·ன·ந / ஒற்று, சொல் வடிவம், தொடரியல், உரைநடை) வாரியாகப் பிழைகள் பட்டைகளாகக் காட்டப்படும்.\",\"ஒரு பட்டையைச் சொடுக்கினால் அப்பகுப்புப் பிழைகள் மட்டும் காட்டப்படும்; மீண்டும் சொடுக்கினால் எல்லாம் தெரியும்.\",\"அதன் கீழ் நான்கு இலக்கணக் <b>கூறுகள்</b> (இயைபு, எதிர்மறை வினைமுற்று, இலக்கணக் குறைபாடு, மரபு) வாரியான எண்ணிக்கை தரப்படும்.\"],ill:()=>`<div class=\"ill\">${a(\"பிழை அறிக்கை\")}<div class=\"in rep\"><div class=\"eyebrow\">பிழை அறிக்கை</div><div><span class=\"big\">11</span> <b>பிழைகள் கண்டறியப்பட்டன</b></div>\\n        ${[[\"ள·ல·ழ\",1,\"c-ezh1\"],[\"ண·ன·ந / ஒற்று\",4,\"c-ezh2\"],[\"சொல் வடிவம்\",3,\"c-sol\"],[\"தொடரியல்\",2,\"c-thodar\"],[\"உரைநடை\",1,\"c-urai\"]].map(([s,a,i])=>`<div class=\"bar\"><span style=\"color:var(--${i})\">${s}</span><i style=\"width:${25*a}%;background:var(--${i})\"></i><b>${a}</b></div>`).join(\"\")}\\n        <div class=\"kv\" style=\"margin-top:4px\"><span class=\"chip comp\">இயைபு · 3</span><span class=\"chip comp\">எதிர்மறை · 1</span><span class=\"chip comp\">குறைபாடு · 6</span><span class=\"chip comp\">மரபு · 1</span></div></div></div>`},{t:\"விளக்க அட்டைகளைப் பயன்படுத்துதல்\",steps:[\"ஒவ்வொரு பிழைக்கும் ஒரு விளக்க அட்டை உண்டு: பிழை எண், பகுப்பு, கூறு, பிழையின் பெயர், தவறு → சரி, இலக்கண விளக்கம்.\",\"விளக்கத்தைப் படித்து அந்தப் பிழைக்குரிய <b>இலக்கண விதியைப்</b> புரிந்துகொள்ளுங்கள்.\",\"<b>இதைத் திருத்து</b> பொத்தானை அழுத்தினால் அந்த ஒரு திருத்தம் மட்டும் உரையில் செய்யப்பட்டு, உரை மீண்டும் சரிபார்க்கப்படும்.\",\"பரிந்துரை உங்கள் கருத்துக்குப் பொருந்தாவிடில் அதைப் புறக்கணித்து உரையை நீங்களே திருத்தலாம்.\"],ill:()=>`<div class=\"ill\">${a(\"பிழை அறிக்கை · அட்டை 2\")}<div class=\"in\"><div class=\"mcard\"><div class=\"hd\"><span class=\"n\">2</span><span class=\"chip c-thodar\"><span class=\"dot\"></span>தொடரியல்</span><span class=\"chip comp\">திணை, பால், எண், இட இயைபு</span></div><h4>எழுவாய் – பயனிலை இயைபுப் பிழை (இட வழு)</h4><div class=\"chg\"><span class=\"wrong\">சென்றார்கள்</span> → <span class=\"right\">சென்றோம்</span></div><p>தன்மையுடன் பிற இடம் சேர்ந்தால் பயனிலை தன்மைப் பன்மையில் அமையும் (நானும் தம்பியும் சென்றோம்).</p><span class=\"mb sm hl\" style=\"display:inline-block\">இதைத் திருத்து</span></div></div></div>`},{t:\"திருத்திய உரையைப் பெறுதல்\",steps:['\"திருத்திய உரை\" என்ற பச்சைப் பெட்டியில் எல்லாத் திருத்தங்களும் செய்யப்பட்ட உரை காட்டப்படும்.',\"<b>அனைத்துத் திருத்தங்களையும் ஏற்றுக்கொள்</b> பொத்தான் திருத்திய உரையை உரைப்பெட்டியில் இட்டு மீண்டும் சரிபார்க்கும்.\",\"<b>நகலெடு</b> பொத்தான் திருத்திய உரையை நகலெடுக்கும்; அதை Word, Google Docs, மின்னஞ்சல் போன்றவற்றில் ஒட்டலாம்.\",\"இறுதியாக, திருத்திய உரையை ஒருமுறை படித்துப் பொருள் மாறவில்லை என்பதை உறுதிசெய்யுங்கள்.\"],ill:()=>`<div class=\"ill\">${a(\"திருத்திய உரை\")}<div class=\"in\"><div class=\"fixedm\"><b>✓ திருத்திய உரை</b>நேற்று நானும் என் தம்பியும் பள்ளிக்குச் சென்றோம். வகுப்பில் ஆசிரியர் தமிழ் இலக்கணம் கற்பித்தார்.</div><div class=\"mini-btns\"><span class=\"mb\" style=\"background:var(--indigo);color:var(--on-accent)\">அனைத்துத் திருத்தங்களையும் ஏற்றுக்கொள்</span><span class=\"mb\">நகலெடு</span></div></div></div>`},{t:\"பயிற்சி செய்து புள்ளிகள் பெறுதல்\",steps:[\"<b>குறிப்புகள் & பயிற்சி</b> பக்கத்தில் ஒவ்வொரு குறிப்பையும் படித்தபின் அதன் கீழ் உள்ள பயிற்சியைச் செய்யவும் (ஒவ்வொன்றும் 10 புள்ளிகள்).\",\"<b>பயிற்சி</b> பக்கத்தில் எட்டுத் தலைப்புகளிலிருந்தும் 20 வினாக்கள் கொண்ட தேர்வை window.PZ={classes:[{id:"ezh1",name:"எழுத்துப் பிழை: ள, ல, ழ வேறுபாடு",short:"ள · ல · ழ",what:"ஒலிப்பு ஒத்திருப்பதால் ல, ள, ழ ஆகிய மூன்று எழுத்துகளையும் (அவற்றோடு ர, ற எழுத்துகளையும்) மாற்றி எழுதுதல். எழுத்து மாறினால் சொல்லின் பொருளே மாறிவிடும்.",points:["ல – நுனிநா மேல்வாய்ப் பல்லின் அடியைத் தொட்டு ஒலிக்கும் (வலி = நோவு).","ள – நுனிநா மேல்நோக்கி வளைந்து அண்ணத்தைத் தொட்டு ஒலிக்கும் (வளி = காற்று).","ழ – நுனிநா மேல்நோக்கி வளைந்து அண்ணத்தைத் தொடாமல் வருடி ஒலிக்கும் (வழி = பாதை).","ர (இடையினம்) – ற (வல்லினம்) மயக்கமும் இவ்வகையைச் சார்ந்ததே (கரை = ஓரம்; கறை = அழுக்கு)."],eg:[["கலை","களை","வயலில் களை பிடுங்கினார்"],["வாலைப்பழம்","வாழைப்பழம்","குழந்தை வாழைப்பழம் உண்டது"],["வந்தால்.","வந்தாள்.","அக்காள் வீட்டுக்கு வந்தாள்."]]},{id:"ezh2",name:"எழுத்துப் பிழை: ண, ன, ந / ஒற்றெழுத்துப் பிழை",short:"ண · ன · ந / ஒற்று",what:"மூன்று மெல்லின னகரங்களை மாற்றி எழுதுதல், வலிமிகும் இடத்தில் ஒற்றை விடுதல், வலிமிகா இடத்தில் ஒற்றைச் சேர்த்தல்.",points:['ண் (டண்ணகரம்) "ட"வுடனும், ந் (தந்நகரம்) "த"வுடனும், ன் (றன்னகரம்) "ற"வுடனும் இணைந்து வரும்: ண்ட, ந்த, ன்ற.','"ந" சொல்லின் முதலிலும் "த"வுக்கு முன்னும் மட்டுமே வரும்; "ண", "ன" சொல்லின் முதலில் வாரா.','வலிமிகும் இடங்கள்: அந்த, இந்த, எந்த; இரண்டாம் வேற்றுமை "ஐ"; நான்காம் வேற்றுமை "கு"; அ, இ ஈற்று வினையெச்சம்; "ஆக" ஈற்று வினையடை.',"வலிமிகா இடங்கள்: ஒரு, பல, சில; எழுவாய்; பெயரெச்சம் (வந்த பையன்); வினைத்தொகை (சுடுசோறு); மென்தொடர் வினையெச்சம் (வந்து போனான்)."],eg:[["நண்றி","நன்றி","உதவிக்கு மிக்க நன்றி"],["இந்த பூ","இந்தப் பூ","இந்தப் பூ மணக்கிறது"],["ஒருக் கடை","ஒரு கடை","ஒரு கடையில் வாங்கினேன்"]]},{id:"sol",name:"சொற்பிழை மற்றும் சொல் வடிவப் பிழை",short:"சொல் வடிவம்",what:"சொற்கள் புணரும்போது புணர்ச்சி விதியை மீறுதல், வேர்ச்சொல்லுடன் (பகுதி) இடைநிலை, விகுதிகளைத் தவறாக இணைத்தல், பேச்சு வழக்கு, பிறமொழி, மரபுக்கு மாறான சொற்களைப் பயன்படுத்துதல்.",points:["பெயர்ச்சொல் – வினைச்சொல் புணர்ச்சி: உயிர் ஈற்றின் முன் உயிர் வந்தால் உடம்படுமெய் (ய், வ்) தோன்றும் (தீ + அணைப்பு = தீயணைப்பு).","வினைமுற்று = பகுதி + கால இடைநிலை + விகுதி (படி + த்த் + ஆன் = படித்தான்). இடைநிலையை இருமுறை சேர்த்தல் பிழை (படித்தினான் ✗).","பேச்சு வழக்குச் சொற்கள் (நேத்து, நாங்க, புரியல) எழுத்துத் தமிழில் வாரா.","பிறமொழிச் சொற்களுக்கு (டீச்சர், பஸ்) இணையான தமிழ்ச் சொற்களே (ஆசிரியர், பேருந்து) பயன்படுத்தப்பட வேண்டும்."],eg:[["தீஅணைப்பு","தீயணைப்பு","தீயணைப்பு வீரர்கள் வந்தனர்"],["சாப்பிட்டினான்","சாப்பிட்டான்","அவன் உணவைச் சாப்பிட்டான்"],["டீச்சர்","ஆசிரியர்","ஆசிரியர் பாடம் நடத்தினார்"]]},{id:"thodar",name:"தொடரியல் பிழை (Syntax Error)",short:"தொடரியல்",what:"வாக்கிய உறுப்புகளான எழுவாய், செயப்படுபொருள், பயனிலை ஆகியவற்றின் வரிசை முறை மாறுபடுதல்; ஒருமை – பன்மை மயக்கம்; எழுவாய்க்கும் பயனிலைக்கும் இடையே திணை, பால், எண், இடம் இயையாமை.",points:["உரைநடைத் தமிழின் இயல்பான வரிசை: எழுவாய் + செயப்படுபொருள் + பயனிலை (அவன் பாடம் படித்தான்).","பயனிலை (வினைமுற்று) வாக்கியத்தின் இறுதியில் வர வேண்டும்.",'"ஒவ்வொரு" என்பதைத் தொடர்ந்து ஒருமைப் பெயரே வரும் (ஒவ்வொரு மாணவரும்).',"எழுவாயின் திணை, பால், எண், இடத்துக்கு ஏற்பவே பயனிலையின் விகுதி அமையும்."],eg:[["சென்றான் காலையில் அவன்","அவன் காலையில் சென்றான்","அவன் காலையில் பள்ளிக்குச் சென்றான்"],["ஒவ்வொரு மாணவர்களும்","ஒவ்வொரு மாணவரும்","ஒவ்வொரு மாணவரும் வர வேண்டும்"],["நாய் குரைத்தான்","நாய் குரைத்தது","நாய் இரவு முழுவதும் குரைத்தது"]]},{id:"urai",name:"உரைநடை மற்றும் தர்க்கப் பிழை (Semantic / Stylistic Error)",short:"உரைநடை / தர்க்கம்",what:"நிறுத்தற்குறிகளைத் தவறாகப் பயன்படுத்துதல் அல்லது விடுதல், வாக்கிய அமைப்பில் தெளிவின்மை, பொருள் முரண், தேவையற்ற இணைப்புச் சொற்கள்.",points:["ஒவ்வொரு வாக்கியமும் முற்றுப்புள்ளி (.), வினாக்குறி (?) அல்லது உணர்ச்சிக்குறி (!) கொண்டு முடிய வேண்டும்.","நிறுத்தற்குறிக்கு முன் இடைவெளி விடக் கூடாது; பின் ஓர் இடைவெளி விட வேண்டும்.","எதிர்மறைச் சொற்கள் (யாரும், எதுவும்) உடன்பாட்டு வினையுடன் வந்தால் தர்க்க முரண் ஏற்படும்.",'"என்றாலும்", "ஆனால்" போன்ற ஒரே பொருள் தரும் இணைப்புச் சொற்களை ஒருசேரப் பயன்படுத்தக் கூடாது.'],eg:[["ஏன் வரவில்லை.","ஏன் வரவில்லை?","நீ ஏன் நேற்று வரவில்லை?"],["யாரும் வந்தனர்","யாரும் வரவில்லை","விடுமுறையால் யாரும் வரவில்லை"],["வந்தான் ,","வந்தான்,","அவன் வந்தான், அமர்ந்தான்."]]}],comps:[{id:"iyaibu",name:"திணை, பால், எண், இட இயைபு",what:"எழுவாயும் பயனிலையும் திணை (உயர்திணை / அஃறிணை), பால் (ஆண், பெண், பலர், ஒன்றன், பலவின்), எண் (ஒருமை / பன்மை), இடம் (தன்மை / முன்னிலை / படர்க்கை) ஆகியவற்றில் ஒத்து வர வேண்டும். ஒவ்வாவிடின் திணைவழு, பால்வழு, எண்வழு, இடவழு ஏற்படும்."},{id:"ethir",name:"எதிர்மறை வினைமுற்று",what:'செயல் நிகழாமையைக் குறிக்கும் வினைமுற்று. இறந்த, நிகழ் காலங்களில் "செயவெனெச்சம் + இல்லை" (வரவில்லை) என்றும், எதிர்காலத்தில் "மாட்டு" இடைநிலையுடன் (வரமாட்டேன்) அல்லது அஃறிணையில் "-ஆது" விகுதியுடன் (வராது) அமையும். காலத்துக்கும் பொருளுக்கும் பொருந்தாத எதிர்மறை வடிவம் பிழையாகும்.'},{id:"kurai",name:"இலக்கணக் குறைபாடுகள்",what:"எழுத்து, சொல், புணர்ச்சி, வாக்கிய அமைப்பு, நிறுத்தற்குறி ஆகியவற்றில் இலக்கண விதிகளை மீறுவதால் ஏற்படும் குறைபாடுகள்."},{id:"marabu",name:"மரபுப் பிழைகள்",what:"முன்னோர் வழிவழியாகப் பயன்படுத்தி வந்த சொல் வழக்கை (ஒலி மரபு, இளமைப் பெயர் மரபு, இருப்பிட மரபு, வினை மரபு, தாவர உறுப்பு மரபு) மீறிப் பயன்படுத்துதல்."}],register:[{w:"என் வீட்டு நாய் இரவு முழுவதும் குரைத்தான்.",bad:"குரைத்தான்",r:"என் வீட்டு நாய் இரவு முழுவதும் குரைத்தது.",good:"குரைத்தது",comp:"iyaibu",sub:"திணை வழு",cls:"thodar",ex:'"நாய்" அஃறிணை ஒன்றன்பால் எழுவாய். எனவே பயனிலையும் ஒன்றன்பால் விகுதி "-து" பெற்று "குரைத்தது" என்று வர வேண்டும். உயர்திணை ஆண்பால் விகுதி "-ஆன்" இங்குப் பொருந்தாது.'},{w:"என் அக்காள் நேற்று விடுதியிலிருந்து வந்தான்.",bad:"வந்தான்",r:"என் அக்காள் நேற்று விடுதியிலிருந்து வந்தாள்.",good:"வந்தாள்",comp:"iyaibu",sub:"பால் வழு",cls:"thodar",ex:'"அக்காள்" உயர்திணைப் பெண்பால் எழுவாய். பயனிலை பெண்பால் விகுதி "-ஆள்" பெற்று "வந்தாள்" என்று அமைய வேண்டும்.'},{w:"மாணவர்கள் விளையாட்டுப் போட்டியில் கலந்துகொண்டான்.",bad:"கலந்துகொண்டான்",r:"மாணவர்கள் விளையாட்டுப் போட்டியில் கலந்துகொண்டனர்.",good:"கலந்துகொண்டனர்",comp:"iyaibu",sub:"எண் வழு",cls:"thodar",ex:'"மாணவர்கள்" பலர்பால் (பன்மை) எழுவாய். பயனிலையும் பலர்பால் விகுதி "-அனர்" அல்லது "-ஆர்கள்" பெற வேண்டும்.'},{w:"நானும் என் தம்பியும் கோயிலுக்குச் சென்றார்கள்.",bad:"சென்றார்கள்",r:"நானும் என் தம்பியும் கோயிலுக்குச் சென்றோம்.",good:"சென்றோம்",comp:"iyaibu",sub:"இட வழு",cls:"thodar",ex:'தன்மை (நான்) படர்க்கையுடன் (தம்பி) சேர்ந்து எழுவாயாக வரும்போது பயனிலை தன்மைப் பன்மையில் ("-ஓம்") அமையும்.'},{w:"ஒவ்வொரு மாணவர்களும் தம் புத்தகத்தைக் கொண்டுவர வேண்டும்.",bad:"மாணவர்களும்",r:"ஒவ்வொரு மாணவரும் தம் புத்தகத்தைக் கொண்டுவர வேண்டும்.",good:"மாணவரும்",comp:"iyaibu",sub:"எண் வழு (ஒருமை – பன்மை)",cls:"thodar",ex:'"ஒவ்வொரு" என்பது ஒவ்வொருவரையும் தனித்தனியே குறிக்கும் சொல். அதைத் தொடர்ந்து ஒருமைப் பெயரே வர வேண்டும்.'},{w:"நாளை நான் பள்ளிக்கு வரவில்லை.",bad:"வரவில்லை",r:"நாளை நான் பள்ளிக்கு வரமாட்டேன்.",good:"வரமாட்டேன்",comp:"ethir",sub:"கால மயக்கம்",cls:"sol",ex:'"இல்லை" இறந்த, நிகழ் காலச் செயல் நிகழாமையைக் குறிக்கும். "நாளை" எதிர்காலம் என்பதால் "மாட்டு" இடைநிலை கொண்ட எதிர்கால எதிர்மறை வினைமுற்று "வரமாட்டேன்" வர வேண்டும்.'},{w:"விடுமுறை என்பதால் யாரும் பள்ளிக்கு வந்தனர்.",bad:"வந்தனர்",r:"விடுமுறை என்பதால் யாரும் பள்ளிக்கு வரவில்லை.",good:"வரவில்லை",comp:"ethir",sub:"பொருள் முரண்",cls:"urai",ex:'"யாரும்" எதிர்மறைப் பொருளுடன் மட்டுமே வரும் சொல். "விடுமுறை" என்ற காரணத்துக்கும் பொருந்த, எதிர்மறை வினைமுற்று வேண்டும்; இல்லையேல் தர்க்க முரண் ஏற்படும்.'},{w:"எனக்குக் கணக்கு புரியல.",bad:"புரியல",r:"எனக்குக் கணக்கு புரியவில்லை.",good:"புரியவில்லை",comp:"ethir",sub:"பேச்சு வழக்கு எதிர்மறை",cls:"sol",ex:'"புரியல" பேச்சு வழக்கு. எழுத்துத் தமிழில் எதிர்மறை வினைமுற்று "செயவெனெச்சம் + இல்லை" (புரிய + இல்லை = புரியவில்லை) என்று அமையும்.'},{w:"காட்டில் யானை கத்தியது.",bad:"கத்தியது",r:"காட்டில் யானை பிளிறியது.",good:"பிளிறியது",comp:"marabu",sub:"ஒலி மரபு",cls:"sol",ex:'யானையின் ஒலியைப் "பிளிறல்" என்பதே மரபு. சிங்கம் முழங்கும், குயில் கூவும், மயில் அகவும், காகம் கரையும், நாய் குரைக்கும், குதிரை கனைக்கும்.'},{w:"பசு தன் குட்டிக்குப் பால் கொடுத்தது.",bad:"குட்டிக்குப்",r:"பசு தன் கன்றுக்குப் பால் கொடுத்தது.",good:"கன்றுக்குப்",comp:"marabu",sub:"இளமைப் பெயர் மரபு",cls:"sol",ex:'பசுவின் இளமைப் பெயர் "கன்று". கோழி, கிளி போன்ற பறவைகளின் இளமைப் பெயர் "குஞ்சு"; நாய், பூனை, ஆடு ஆகியவற்றின் இளமைப் பெயர் "குட்டி".'},{w:"சிறுவன் தண்ணீர் சாப்பிட்டான்.",bad:"சாப்பிட்டான்",r:"சிறுவன் தண்ணீர் குடித்தான்.",good:"குடித்தான்",comp:"marabu",sub:"வினை மரபு",cls:"sol",ex:'நீர்மப் பொருள்களைக் "குடித்தல்" அல்லது "பருகுதல்" என்பதே மரபு. "சாப்பிடுதல்" திட உணவுக்கு உரியது.'},{w:"விவசாயி வயலில் கலை பிடுங்கினார்.",bad:"கலை",r:"விவசாயி வயலில் களை பிடுங்கினார்.",good:"களை",comp:"kurai",sub:"ல / ள மயக்கம்",cls:"ezh1",ex:'"கலை" என்பது ஓவியம், இசை போன்ற நுண்கலை; "களை" என்பது பயிருக்கு இடையே வளரும் தேவையற்ற செடி. ல, ள மாறினால் பொருள் முற்றிலும் மாறிவிடும்.'},{w:"குழந்தை வாலைப்பழம் சாப்பிட்டது.",bad:"வாலைப்பழம்",r:"குழந்தை வாழைப்பழம் சாப்பிட்டது.",good:"வாழைப்பழம்",comp:"kurai",sub:"ல / ழ மயக்கம்",cls:"ezh1",ex:'"வாழை" என்ற சொல்லில் சிறப்பு "ழ" வர வேண்டும். நுனிநா மேல்நோக்கி வளைந்து அண்ணத்தை வருடுவதால் "ழ" ஒலி பிறக்கும்.'},{w:"நீங்கள் செய்த உதவிக்கு மிக்க நண்றி.",bad:"நண்றி",r:"நீங்கள் செய்த உதவிக்கு மிக்க நன்றி.",good:"நன்றி",comp:"kurai",sub:"ண / ன மயக்கம்",cls:"ezh2",ex:'"ற" என்ற வல்லினத்துக்கு இனமான மெல்லினம் றன்னகரம் "ன்". எனவே "ன்ற" என்றே வரும்; "ண்ற" என்ற எழுத்துக்கூட்டு தமிழில் இல்லை.'},{w:"நான் பாடத்தை படித்துவிட்டு ஒருக் கடைக்கு சென்றேன்.",bad:"பாடத்தை",r:"நான் பாடத்தைப் படித்துவிட்டு ஒரு கடைக்குச் சென்றேன்.",good:"பாடத்தைப்",comp:"kurai",sub:"வலிமிகும் / மிகா இடங்கள்",cls:"ezh2",ex:'இரண்டாம் வேற்றுமை உருபு "ஐ", நான்காம் வேற்றுமை உருபு "கு" ஆகியவற்றின் பின் வல்லினம் மிகும் (பாடத்தைப் படித்து, கடைக்குச் சென்றேன்). "ஒரு" என்ற எண்ணுப்பெயரின் பின் வல்லினம் மிகாது (ஒரு கடை).'},{w:"தீஅணைப்பு வீரர்கள் விரைந்து வந்தனர்.",bad:"தீஅணைப்பு",r:"தீயணைப்பு வீரர்கள் விரைந்து வந்தனர்.",good:"தீயணைப்பு",comp:"kurai",sub:"புணர்ச்சி (உடம்படுமெய்)",cls:"sol",ex:'நிலைமொழி "தீ" (பெயர்) "ஈ" என்ற உயிரில் முடிகிறது; வருமொழி "அணைப்பு" (வினையடியாகப் பிறந்த பெயர்) "அ" என்ற உயிரில் தொடங்குகிறது. இ, ஈ, ஐ ஈற்றின் பின் "ய்" உடம்படுமெய் தோன்றும்: தீ + ய் + அணைப்பு = தீயணைப்பு.'},{w:"அவன் உணவைச் சாப்பிட்டினான்.",bad:"சாப்பிட்டினான்",r:"அவன் உணவைச் சாப்பிட்டான்.",good:"சாப்பிட்டான்",comp:"kurai",sub:"பகுதி + விகுதி இணைப்பு",cls:"sol",ex:'வினைமுற்று = பகுதி + கால இடைநிலை + விகுதி: சாப்பிடு + ட் + ஆன் = சாப்பிட்டான். ஏற்கெனவே இறந்தகால இடைநிலை உள்ளதால் "இன்" என்ற இரண்டாவது இடைநிலையைச் சேர்ப்பது பிழை.'},{w:"பள்ளிக்குச் சென்றான் காலையில் அவன்.",bad:"பள்ளிக்குச் சென்றான் காலையில் அவன்",r:"அவன் காலையில் பள்ளிக்குச் சென்றான்.",good:"அவன் காலையில் பள்ளிக்குச் சென்றான்",comp:"kurai",sub:"சொல் வரிசை",cls:"thodar",ex:'உரைநடைத் தமிழில் வாக்கியம் "எழுவாய் + பிற உறுப்புகள் + பயனிலை" என்ற வரிசையில் அமையும். பயனிலை "சென்றான்" வாக்கியத்தின் இறுதியில் வர வேண்டும்.'},{w:"ஆசிரியர் சொன்னார் நாளை விடுமுறை என்று மாணவர்கள் மகிழ்ந்தனர்",bad:"சொன்னார்",r:"நாளை விடுமுறை என்று ஆசிரியர் சொன்னார். அதனால், மாணவர்கள் மகிழ்ந்தனர்.",good:"சொன்னார்.",comp:"kurai",sub:"நிறுத்தற்குறி / தெளிவின்மை",cls:"urai",ex:'இரண்டு வாக்கியங்கள் நிறுத்தற்குறியின்றி இணைந்துள்ளதால் "நாளை விடுமுறை" என்று சொன்னது யார் என்பது தெளிவற்றுப் போகிறது. ஒவ்வொரு வாக்கியமும் முற்றுப்புள்ளியுடன் முடிய வேண்டும்; மேற்கோள் பகுதி பயனிலைக்கு முன் வர வேண்டும்.'},{w:"என் டீச்சர் நிறைய ஹோம்வொர்க் கொடுத்தார்.",bad:"டீச்சர்",r:"என் ஆசிரியர் நிறைய வீட்டுப்பாடம் கொடுத்தார்.",good:"ஆசிரியர்",comp:"kurai",sub:"பிறமொழிக் கலப்பு",cls:"sol",ex:'"டீச்சர்", "ஹோம்வொர்க்" ஆகியவை ஆங்கிலச் சொற்கள். எழுத்துத் தமிழில் அவற்றுக்கு இணையான "ஆசிரியர்", "வீட்டுப்பாடம்" ஆகிய தமிழ்ச் சொற்களையே பயன்படுத்த வேண்டும்.'}],quiz:{a:[{s:"அம்மா சந்தையில் பலம் வாங்கினார்.",i:2,fix:"பழம்",cls:"ezh1",ex:'"பலம்" = வலிமை; "பழம்" = கனி. சந்தையில் வாங்குவது "பழம்".'},{s:"மயில் தோகை விரித்துக் கூவியது.",i:3,fix:"அகவியது",cls:"sol",ex:'மயிலின் ஒலி "அகவல்"; குயில்தான் கூவும் (ஒலி மரபு).'},{s:"அந்த பையன் வேகமாக ஓடினான்.",i:0,fix:"அந்தப்",cls:"ezh2",ex:'"அந்த" என்ற சுட்டுச் சொல்லின் பின் வல்லினம் மிகும்: அந்தப் பையன்.'},{s:"குழந்தைகள் பூங்காவில் விளையாடினான்.",i:2,fix:"விளையாடினர்",cls:"thodar",ex:'"குழந்தைகள்" பன்மை எழுவாய்; பயனிலையும் பன்மையில் வர வேண்டும் (எண் இயைபு).'},{s:"நாங்கள் நேற்று நூலகத்துக்குச் சென்றீர்கள்.",i:3,fix:"சென்றோம்",cls:"thodar",ex:'"நாங்கள்" தன்மைப் பன்மை; பயனிலை "-ஓம்" விகுதி பெறும் (இட இயைபு).'},{s:"என் தங்கை அழகாகப் பாடினான்.",i:3,fix:"பாடினாள்",cls:"thodar",ex:'"தங்கை" பெண்பால்; பயனிலை "-ஆள்" விகுதி பெறும் (பால் இயைபு).'},{s:"அவன் புதிய எழுதுக்கோல் வாங்கினான்.",i:2,fix:"எழுதுகோல்",cls:"ezh2",ex:'"எழுதுகோல்" வினைத்தொகை; வினைத்தொகையில் வல்லினம் மிகாது.'},{s:"நாளை மழை பெய்யவில்லை என வானிலை அறிக்கை கூறியது.",i:2,fix:"பெய்யாது",cls:"sol",ex:'எதிர்காலச் செயலை மறுக்க "-ஆது" வடிவம் வேண்டும்: நாளை மழை பெய்யாது (எதிர்மறை வினைமுற்று).'}],b:[{q:"ஆசிரியர் மாணவர்களுக்குக் கதை ______.",o:["சொன்னான்","சொன்னார்","சொன்னது","சொன்னாள்"],a:1,cls:"thodar",ex:'"ஆசிரியர்" உயர்திணை மரியாதைப் பன்மை; பயனிலை "-ஆர்" விகுதி பெறும்.'},{q:"சிங்கம் காட்டில் ______.",o:["கத்தியது","முழங்கியது","கூவியது","அலறியது"],a:1,cls:"sol",ex:'சிங்கத்தின் ஒலி "முழக்கம்" (ஒலி மரபு).'},{q:"கோழியின் இளமைப் பெயர் எது?",o:["குட்டி","கன்று","குஞ்சு","பிள்ளை"],a:2,cls:"sol",ex:'பறவைகளின் இளமைப் பெயர் "குஞ்சு" (இளமைப் பெயர் மரபு).'},{q:"ஒற்று சரியாக அமைந்துள்ள தொடர் எது?",o:["நல்லப் பையன்","வந்தப் பெண்","மெதுவாகப் பேசு","ஒருக் கதை"],a:2,cls:"ezh2",ex:'"ஆக" என முடியும் வினையடையின் பின் வல்லினம் மிகும். பெயரெச்சம் (நல்ல, வந்த), "ஒரு" ஆகியவற்றின் பின் மிகாது.'},{q:'"நாளை நான் உன் வீட்டுக்கு ______." (எதிர்மறை)',o:["வரவில்லை","வரமாட்டேன்","வரல","வராதே"],a:1,cls:"sol",ex:"தன்மை ஒருமை எதிர்கால எதிர்மறை: வர + மாட்டு + ஏன் = வரமாட்டேன்."},{q:'"மா + இலை" புணர்ந்து வரும் சரியான வடிவம் எது?',o:["மாஇலை","மாயிலை","மாவிலை","மாயீலை"],a:2,cls:"sol",ex:'அ, ஆ, உ, ஊ, ஒ, ஓ, ஔ ஈற்றின் பின் "வ்" உடம்படுமெய் தோன்றும்: மா + வ் + இலை = மாவிலை.'},{q:"சரியாக எழுதப்பட்ட சொல் எது?",o:["கணிணி","கனினி","கணினி","கனிணி"],a:2,cls:"ezh2",ex:'கணி + இனி = "கணினி": முதலில் டண்ணகரம், பின் றன்னகரம்.'},{q:"நிறுத்தற்குறி சரியாக அமைந்த வாக்கியம் எது?",o:["நீ எப்போது வருவாய்.","நீ எப்போது வருவாய்?","நீ எப்போது வருவாய்!","நீ, எப்போது வருவாய்"],a:1,cls:"urai",ex:"வினாச்சொல் (எப்போது) உள்ள வாக்கியம் வினாக்குறியுடன் (?) முடிய வேண்டும்."}],c:[{s:"நாய் வீட்டு வாசலில் படுத்திருந்தான்.",bad:"படுத்திருந்தான்",ok:["படுத்திருந
